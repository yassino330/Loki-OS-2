name: Build LokiOS image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*-beta*"
    paths:
      - "kernel/**"
      - "scripts/build-kernel.sh"
      - "scripts/build-image.sh"
      - "scripts/lokios-install"
      - "scripts/test-boot-qemu.sh"
      - "scripts/lokios-vm-health"
      - "src/**"
      - "os/**"
      - "docs/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-kernel.yml"

# New commits replace obsolete builds instead of filling the runner queue.
concurrency:
  group: lokios-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out LokiOS
        uses: actions/checkout@v4

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio debootstrap flex git \
            grub-common grub-efi-amd64-bin grub-pc-bin libelf-dev libssl-dev make mtools perl python3 \
            qemu-system-x86 qemu-utils ovmf squashfs-tools tar xorriso xz-utils

      - name: Validate build and installer shell scripts
        run: |
          bash -n scripts/build-image.sh scripts/build-kernel.sh scripts/lokios-install scripts/test-boot-qemu.sh scripts/lokios-vm-health
          test -f scripts/test-boot-qemu.sh
          test -f scripts/lokios-vm-health
          qemu-system-x86_64 -device help 2>&1 | grep -q 'usb-kbd'
          qemu-system-x86_64 -device help 2>&1 | grep -q 'virtio-keyboard-pci'

      - name: Select the verified cached Linux kernel revision
        id: kernel-source
        run: |
          # Reuse the exact Linux 6.12.y revision already built and cached.
          KERNEL_COMMIT="03bae623ec326c2738198739625832aab0eb120a"
          echo "commit=$KERNEL_COMMIT" >> "$GITHUB_OUTPUT"

      # Cache identity includes the exact upstream kernel commit, not just the moving branch name.
      # Reuse the built kernel only when source, config, and build recipe all match.

      - name: Restore prebuilt Linux kernel
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: lokios-kernel-v2-${{ runner.os }}-${{ steps.kernel-source.outputs.commit }}-${{ hashFiles('kernel/config.fragment', 'scripts/build-kernel.sh') }}

      # Restore the most recent compiler cache, then save a fresh snapshot every run.
      - name: Restore kernel compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-
            lokios-ccache-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}
            lokios-ccache-${{ runner.os }}-

      - name: Build LokiOS kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          JOBS: "2"
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: "true"
          KERNEL_COMMIT: ${{ steps.kernel-source.outputs.commit }}
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          bash scripts/build-kernel.sh
          ccache --show-stats

      - name: Save prebuilt Linux kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/kernel
          key: lokios-kernel-v2-${{ runner.os }}-${{ steps.kernel-source.outputs.commit }}-${{ hashFiles('kernel/config.fragment', 'scripts/build-kernel.sh') }}

      - name: Save updated kernel compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build graphical live ISO
        run: sudo -E bash scripts/build-image.sh

      - name: Verify ISO output
        run: |
          test -s out/LokiOS-graphical-x86_64.iso
          ls -lh out/LokiOS-graphical-x86_64.iso
          ISO_BYTES="$(stat -c '%s' out/LokiOS-graphical-x86_64.iso)"
          echo "ISO size: $ISO_BYTES bytes"
          test "$ISO_BYTES" -lt 1073741824 || { echo "ISO exceeds the 1 GiB target."; exit 1; }
          sha256sum out/LokiOS-graphical-x86_64.iso > out/LokiOS-graphical-x86_64.iso.sha256

      - name: Boot LokiOS in a UEFI virtual machine
        run: bash scripts/test-boot-qemu.sh out/LokiOS-graphical-x86_64.iso out/qemu-uefi-boot.log

      - name: Upload LokiOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokios-graphical-iso-x86_64
          path: |
            out/LokiOS-graphical-x86_64.iso
            out/LokiOS-graphical-x86_64.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish beta GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/LokiOS-graphical-x86_64.iso \
            out/LokiOS-graphical-x86_64.iso.sha256 \
            --title "LokiOS $GITHUB_REF_NAME" \
            --notes-file docs/BETA-RELEASE.md

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokios-kernel-build-details
          path: |
            out/kernel/kernel.config
            out/kernel/System.map
            out/kernel/kernel-release.txt
            out/lokios-ui-smoke.log
            out/lightdm-effective.conf
            out/qemu-uefi-boot.log
          if-no-files-found: ignore
          retention-days: 7
