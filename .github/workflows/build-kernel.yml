name: Build LokiOS image

on:
  workflow_dispatch:
  push:
    paths:
      - "kernel/**"
      - "scripts/build-kernel.sh"
      - "scripts/build-image.sh"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-kernel.yml"

# New commits replace obsolete builds instead of filling the runner queue.
concurrency:
  group: lokios-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out LokiOS
        uses: actions/checkout@v4

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio debootstrap flex git \
            grub-common grub-efi-amd64-bin grub-pc-bin libelf-dev libssl-dev make mtools perl python3 \
            squashfs-tools tar xorriso xz-utils

      # Restore the most recent compiler cache, then save a fresh snapshot every run.
      - name: Restore kernel compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-
            lokios-ccache-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}
            lokios-ccache-${{ runner.os }}-

      - name: Build LokiOS kernel
        env:
          JOBS: "2"
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: "true"
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          bash scripts/build-kernel.sh
          ccache --show-stats

      - name: Save updated kernel compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: lokios-ccache-v2-${{ runner.os }}-${{ hashFiles('kernel/config.fragment') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build graphical live ISO
        run: sudo -E bash scripts/build-image.sh

      - name: Verify ISO output
        run: |
          test -s out/LokiOS-graphical-x86_64.iso
          ls -lh out/LokiOS-graphical-x86_64.iso
          ISO_BYTES="$(stat -c '%s' out/LokiOS-graphical-x86_64.iso)"
          echo "ISO size: $ISO_BYTES bytes"
          test "$ISO_BYTES" -lt 1073741824 || { echo "ISO exceeds the 1 GiB target."; exit 1; }

      - name: Upload bootable LokiOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: lokios-graphical-iso-x86_64
          path: out/LokiOS-graphical-x86_64.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokios-kernel-build-details
          path: |
            out/kernel/kernel.config
            out/kernel/System.map
            out/kernel/kernel-release.txt
          if-no-files-found: ignore
          retention-days: 7
